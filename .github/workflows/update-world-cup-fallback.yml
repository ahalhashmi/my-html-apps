name: Update UAE Pro League data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-world-cup-fallback.yml"
      - "world-cup/scripts/update_uae_pro_league.mjs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UAE league parser
        run: npm install --prefix world-cup/scripts --no-audit --no-fund

      - name: Fetch official UAE Pro League data
        run: node world-cup/scripts/update_uae_pro_league.mjs --season 2026

      - name: Commit changed UAE data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- world-cup/data/uae-pro-league.json; then
            echo "No UAE Pro League data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-cup/data/uae-pro-league.json
          git commit -m "Update UAE Pro League data"
          git push
